services:
  - type: web
    name: decision-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: src:backend
      - key: PYTHON_VERSION
        value: 3.11.8

